# SynapseFly on your VPS. The production topology is **backend here, frontend on Vercel**
# (deploy/DEPLOY.md), so `docker compose up -d` starts the backend only - the `frontend`
# service sits behind the `selfhost` profile and is opt-in.
# Containers join an EXISTING Caddy network (set it under `networks:` at the bottom) so
# that Caddy reverse-proxies to them by name. Neither publishes a host port, so nothing
# on 80/443/3000/4000 of the host is touched.

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: synapsefly-backend:latest
    container_name: synapsefly-backend
    restart: unless-stopped
    env_file:
      - ./synapsefly.env
    expose:
      - "4000"
    volumes:
      - synapsefly_data:/app/data
    networks:
      - caddy_net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Optional self-host alternative to Vercel. DEPLOY.md step 2 only copies `backend deploy`, so this build
  # context does not exist on the VPS unless you also `scp -r frontend` - hence the profile: without
  # `--profile selfhost` compose never looks at it, and `docker compose build` cannot fail on it.
  frontend:
    profiles: ["selfhost"]
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: "wss://api.synapsefly.com/ws"
        NEXT_PUBLIC_API_URL: "https://api.synapsefly.com"
    image: synapsefly-frontend:latest
    container_name: synapsefly-frontend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - caddy_net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  caddy_net:
    external: true
    # The network your Caddy container is already on (`docker network ls`). This is the one value in this
    # file that is specific to the host it runs on.
    name: crypto-automation_social-engine-net

volumes:
  synapsefly_data:
