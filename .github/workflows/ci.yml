# Everything a reviewer would run locally, on every push and PR. Two independent jobs, because a red brain and a red
# page are different problems: `backend` is the pytest suite (the biological gates live in there), `frontend` is the
# exact trio named in frontend/AGENTS.md - typecheck, lint, build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # pyproject: requires-python = ">=3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: pytest
        working-directory: backend          # the import root is backend/ (see backend/pyproject.toml)
        run: python -m pytest -q

  frontend:
    name: frontend (typecheck / lint / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: lint
        working-directory: frontend
        run: npm run lint
      - name: build
        working-directory: frontend
        run: npm run build
